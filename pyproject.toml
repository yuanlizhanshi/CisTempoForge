[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CisTempoForge"
version = "0.1.0"
description = "Reusable modeling and training components for temporal cis-regulatory prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "yuanlizhanshi"}]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyarrow>=12",
  "scipy>=1.10,<2",
  "torch>=2.1",
]

[project.optional-dependencies]
preprocessing = ["pyfaidx>=0.7"]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/yuanlizhanshi/CisTempoForge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
